<div class="bar"><select id="fsel" style="display:none"><option>— select a flight —</option></select><button class="btn g" id="mdctog" title="Switch the card between the Datacard and the MDC format (Mission Data Card layout). Click a cell to edit it (Tab moves to the next)">MDC format</button><button class="btn g" id="rstf" style="display:none" title="Throw away the changes made by hand to this flight's datacard and fill it in again automatically">↺ Reset datacard</button><span id="cinfo" class="hint"></span><span class="wtip" style="margin-left:auto" title="AUTOMATIC RULES: what the program fills in, and from where. A value typed by hand is kept for that flight; Auto (the Reset button of the card) gives the rules back. Yellow cells are filled by a rule or chosen from a list.&#10;&#10;AIRBASE&#10;DEP: the airbase nearest to the take-off steerpoint. ARR: the nearest to the first landing steerpoint. ALTN: the last landing steerpoint, when it is another airbase. Name, TACAN, GND / APP frequencies, elevation and ILS come from the airbase data; RWY and ILS: the runway into the wind of the weather maps at the take-off or landing time.&#10;ATIS: wind, visibility, clouds, temperature and QNH of the weather at the departure time, with the TAF of the target added.&#10;&#10;FLIGHT AND PACKAGE&#10;Pilot names: the pilots of the flight in the squadron roster. IDM, TCN: by position in the element (TCN 12Y, 22Y, 75Y, 85Y plus the flight number). Link 16 and IFF: from the Link 16 and IFF files of the BMS folder, by position in the element (the IFF modes and their change times, when the IFF file has them; later changes go to the notes).&#10;Package: up to 5 flights, with callsign, number and type of aircraft, UHF / VHF of the radio plan, TCN (12Y, 13Y...) and task.&#10;&#10;FLIGHT PLAN&#10;One line per steerpoint (24 at most): action; TOS = arrival time, with the departure after a wait of a minute or more (not at take-off and landing); HDG, distance and Mach / TAS from the previous steerpoint (after landing, from the landing steerpoint); altitude; formation of the element (Trail below 5 000 ft, Echelon at landing); Min.Fuel from the fuel plan of the Performance page.&#10;&#10;LOADOUT AND PERFORMANCE&#10;A-A, A-G, ECM, tanks: the weapons of the first loadout. Gross weight, drag index and fuel: empty weight + fuel + stores, with the weight and drag of pylons and racks. TO Fuel: the fuel at the parking spot minus 10 minutes of start and taxi. Bingo and Joker: the fuel plan of the Performance page (the DTC Bingo, with Joker = Bingo + 1 000 lb, when the DTC holds one).&#10;TO Spec (AB or MIL, click to switch, with the pitch at lift-off), rotation speed, refusal speed (needs the runway length), Mil Power rpm, Mil Climb: the Performance page, with the elevation, wind and temperature of the departure.&#10;&#10;TARGET (PRIMARY / SECONDARY, TOT, POSITION)&#10;PRIMARY, automatic&#10;1. The first steerpoint of the flight that is not takeoff, route, tanker or landing; the steerpoints with the same action form the group.&#10;2. Name: against ground units (DEAD, SEAD, CAS, ON CALL / PRE-PLAN CAS, BAI, SCAR, AI, FAC(A)) the hostile battalion within 1 km of the attack point; otherwise the closest object (3 km); otherwise the action (Strike, Sweep, Recon...).&#10;3. ESCORT: Escort plus the callsigns of the package flights that attack ground targets.&#10;4. STPT 99 of the DTC, when it is used, replaces name and position.&#10;&#10;SECONDARY, automatic&#10;1. The first other flight of the package with an attack action (same rules as the primary); the other flights go to the free text.&#10;2. STPT 98 of the DTC, when it is used, replaces it.&#10;&#10;TOT, automatic&#10;CAS (all kinds): time on station, first to last attack point. Air missions (BARCAP, sweep...): the patrol time. Other missions: the TOT of the first action steerpoint.&#10;&#10;BY HAND&#10;The box shows the name, the position and the TOT of the point you pick. A point without a TOT of its own gets the one of this flight's action steerpoint. The choice is saved in the mission and is the same for every pilot of the flight.&#10;&#10;WEAPON AND DELIVERY&#10;Profile 1 / 2 (mode, fuze, SGL / PAIR, AD, BA, release angle, pulses, spacing) and the bomb code: from the bomb profiles and the laser code of the DTC; a change on the card is written back into the DTC while the weapon sync is on.&#10;Delivery: VRP or VIP (as the DTC chooses), TBRG / RNG / ELV of the reference and of the pull-up point, OA1 and OA2 of the steerpoint, in ft, from the NAV OFFSETS of the DTC; attack, headings, altitudes and speeds from the Weapons page (written by its Apply). With the Manual entry the values and the steerpoint come from the page.&#10;&#10;EWS AND DTC SETTINGS&#10;EWS programs: the comments of the DTC. ALOW, MSL and Bingo: the ICP of the DTC. The card and the DTC stay in step in both directions while the sync of the group is on.&#10;&#10;SUPPORT&#10;Tankers 1 and 2: the tankers of the package (the best ones when the package has none); AWACS and JSTAR of the package: callsign and aircraft, TACAN, UHF, position from the bullseye and operating window. FAC / JTAC: of the flight when it flies a mission with one (the UHF 6 of the DTC radio plan is the frequency).&#10;&#10;BVR TIMELINE&#10;Per enemy class: MTR, FR, MAR, DR, DOR from the BVR model of the Missiles page, at its standard conditions (kept in memory, worked out again only when something changes).&#10;&#10;EPHEMERIDES&#10;Sun rise and set, Moon rise and set with its illumination, for the first action steerpoint (target area) on the day of the mission.">ⓘ Automatic rules</span></div>

<script>
// The program's own message boxes (instead of the ones of Windows): alert() shows a message, confirm() asks and gives a promise (always await it). Fade in / out like the other menus.
(function(){
 const Q=[];let busy=false;
 const anim=()=>!document.documentElement.classList.contains('noanim');
 function show(kind,msg){return new Promise(res=>{Q.push({kind,msg:String(msg),res});next()})}
 function next(){
  if(busy||!Q.length)return;busy=true;const {kind,msg,res}=Q.shift();
  const d=document.createElement('dialog');d.className='msg';
  d.innerHTML='<div class="mh"><span class="mi">'+(kind=='confirm'?'?':'i')+'</span><div class="mt"></div></div><div class="mb"><button class="btn" data-ok type="button">OK</button>'+(kind=='confirm'?'<button class="btn g" data-no type="button">Cancel</button>':'')+'</div>';
  d.querySelector('.mt').textContent=msg;
  document.body.append(d);d.showModal();const ok=d.querySelector('[data-ok]');ok.focus();
  let done=false;
  const fin=v=>{if(done)return;done=true;
   const end=()=>{d.remove();busy=false;res(v);next()};
   if(anim()){d.style.pointerEvents='none';const a=d.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.97)'}],{duration:130,easing:'ease-in'});a.onfinish=a.oncancel=end}else end()};
  ok.onclick=()=>fin(true);const no=d.querySelector('[data-no]');if(no)no.onclick=()=>fin(false);
  d.addEventListener('cancel',e=>{e.preventDefault();fin(kind=='confirm'?false:true)});
 }
 // the other dialogs of the program (settings, page choice ...) fade out too
 const c0=HTMLDialogElement.prototype.close;
 HTMLDialogElement.prototype.close=function(v){if(!this.open||this._closing||!anim())return c0.call(this,v);this._closing=true;const d=this;d.style.pointerEvents='none';
  const a=d.animate([{opacity:1,transform:'none'},{opacity:0,transform:'scale(.97)'}],{duration:130,easing:'ease-in'});a.onfinish=a.oncancel=()=>{d._closing=false;d.style.pointerEvents='';c0.call(d,v)}};
 window.alert=msg=>{show('alert',msg)};
 window.confirm=msg=>show('confirm',msg);
})();
</script>
