<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BMS Cards</title>
    <link rel="stylesheet" href="css/style-01.css" />
    <link rel="stylesheet" href="css/style-02.css" />
    <link rel="stylesheet" href="css/style-03.css" />
    <link rel="stylesheet" href="css/style-04.css" />
    <link rel="stylesheet" href="css/style-05.css" />
    <link rel="stylesheet" href="css/style-06.css" />
    <link rel="stylesheet" href="css/style-07.css" />
    <link rel="stylesheet" href="css/style-08.css" />
    <link rel="stylesheet" href="css/style-09.css" />
    <link rel="stylesheet" href="css/style-10.css" />
    <link rel="stylesheet" href="css/style-11.css" />
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <img class="bl" src="logo.svg" alt="" width="112" height="112" draggable="false" />
      <div style="font-size: 18px; font-weight: 600">
        BMS Cards <span id="bootver" style="opacity: 0.6; font-weight: 400"></span>
      </div>
      <div class="bt"><i id="bootbar"></i></div>
      <div id="bootmsg">Loading…</div>
    </div>
    <header>
      <h1>
        <img
          src="logo.svg"
          alt=""
          width="28"
          height="28"
          style="vertical-align: middle; margin-right: 8px; border-radius: 6px"
        />BMS Cards
        <small id="appver" style="opacity: 0.6; font-weight: 400; font-size: 12px; margin-left: 6px"></small>
      </h1>
      <button class="tab on" data-t="kb">
        <svg
          class="tic"
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="2" y="2.5" width="12" height="11" rx="1.5" />
          <path d="M4.5 6h7M4.5 8.5h7M4.5 11h4" /></svg
        >Datacard</button
      ><button class="tab" data-t="dtc">
        <svg
          class="tic"
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3.5" y="2" width="9" height="12" rx="1.5" />
          <path d="M6 2v3h4V2M5.5 8.5h5M5.5 11h5" /></svg
        >Data Cartridge</button
      ><button class="tab" data-t="kn">
        <svg
          class="tic"
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="10" height="11" rx="1.5" />
          <path d="M6 3V1.8h4V3M5.5 7h5M5.5 9.5h5M5.5 12h3" /></svg
        >Kneeboard</button
      ><button class="tab" data-t="dc">
        <svg
          class="tic"
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3.5 1.8h6l3 3v9.4h-9z" />
          <path d="M9.5 1.8v3h3M5.5 8h5M5.5 10.5h5" /></svg
        >Docs</button
      ><button class="tab" data-t="mp">
        <svg
          class="tic"
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M1.8 4l4-1.5 4.4 1.5 4-1.5v9.5l-4 1.5-4.4-1.5-4 1.5z" />
          <path d="M5.8 2.5v9.5M10.2 4v9.5" /></svg
        >Map</button
      ><button class="tab" data-t="wp">
        <svg
          class="tic"
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 13l2-2M4.2 9.8l-1.6-1.6 2-.6 5-5.2 3.4-.6-.6 3.4-5.2 5-.6 2z" /></svg
        >Weapons</button
      ><button class="tab" data-t="ms">
        <svg
          class="tic"
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M2 4h6M2 8h10M2 12h4" />
          <path d="M10 4h4M8 12h6" /></svg
        >BVR Timeline</button
      ><button class="tab" data-t="pf">
        <svg
          class="tic"
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M2 13.5h12" />
          <path d="M2.5 11l3.5-4 2.5 2.5L13.5 3" /></svg
        >Performance</button
      ><button class="tab" data-t="wx">
        <svg
          class="tic"
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4.5 12.5h7a2.8 2.8 0 0 0 .3-5.6A4 4 0 0 0 4 6.5a3 3 0 0 0 .5 6z" /></svg
        >Weather</button
      ><button class="tab" data-t="sq">
        <svg
          class="tic"
          width="14"
          height="14"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="8" cy="5" r="2.3" />
          <path d="M3.2 13.5c.3-2.8 2-4.3 4.8-4.3s4.5 1.5 4.8 4.3" /></svg
        >Squadron</button
      ><button class="tab" id="cfgbtn" style="margin-left: auto">⚙ Settings</button>
    </header>
    <dialog id="cfg"></dialog>
    <main>
      <div class="bar topbar" id="mainbar">
        <span class="openw"
          ><button class="btn" id="openm" title="Open a DTC, a mission or a campaign">📂 Open ▾</button>
          <div id="openmenu" class="openmenu" hidden>
            <button data-o="open">DTC…<small>a DTC file (.ini)</small></button
            ><button data-o="msfopen">Mission…<small>package, DTC, datacard and weapons saved together</small></button
            ><button data-o="cam">Campaign…<small>a .cam, .tac or mission file from any folder</small></button>
          </div></span
        ><button class="btn" id="open" hidden>Open DTC</button
        ><button
          class="btn"
          id="msfopen"
          hidden
          title="Open a mission: the package, the DTC, the datacard and the weapons data saved together. It works without the campaign."
        >
          📦 Open Mission</button
        ><span id="fn" class="hint">No file open (BMS User\Config folder)</span
        ><button
          class="btn bl nil"
          id="wpapply"
          style="margin-left: auto"
          title="Write the attack (NAV OFFSETS, fuze and stick settings) into the DTC"
        >
          Apply to the DTC</button
        ><button
          class="btn g rd nil"
          id="wpclear"
          title="Zero every offset (VIP, VRP, PUP, OA1, OA2) of the DTC, on every steerpoint and profile: for a mission that needs none"
        >
          Clear offsets</button
        ><span id="wpnote" class="hint"></span
        ><button
          class="btn g rd nil"
          id="dtcrev"
          style="margin-left: auto"
          title="Undo every change made to the DTC since it was opened or last saved"
        >
          ↺ Reset</button
        ><button
          class="btn g bl nil"
          id="saveow"
          title="Write the changes into the open DTC file (the original is kept once in the program folder, backup\dtc)"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 16 16"
            class="mpic"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linejoin="round"
          >
            <path d="M2 2h9l3 3v9H2z" />
            <path d="M5 2v4h5V2M4.5 14V9h7v5" />
          </svg>
          DTC</button
        ><button
          class="btn g bl"
          id="msfsave"
          title="Save the mission: a folder with the mission file (package, DTC, datacard and weapons data) and the settings"
        >
          📦 Save mission</button
        ><span
          id="kbtop"
          style="display: flex; margin-left: 0; flex-basis: 100%; align-items: center; gap: 10px; flex-wrap: wrap"
          ><select
            id="csel"
            class="bigsel"
            style="width: auto; max-width: 100%"
            title="Campaigns found in the BMS Campaign folder"
          >
            <option value="">— select a campaign —</option></select
          ><select
            id="tesel"
            class="bigsel"
            style="width: auto; max-width: 100%"
            title="Tactical Engagements (.tac) found in the BMS Campaign folder"
          >
            <option value="">— select a tactical engagement —</option></select
          ><button
            class="btn g"
            id="cam"
            title="Open a .cam (campaign) or .tac (Tactical Engagement) file from another folder"
          >
            📂 Open</button
          ><label
            class="hint"
            style="margin-left: auto"
            title="Date (UTC) of campaign day 1: sun, moon and the day of the METAR / TAF"
            >📅 Day 1: <input type="date" id="d1" style="width: auto" /></label
          ><select id="tsel" class="bigsel sm" style="width: auto; display: none" title="Theater"></select
        ></span>
      </div>

      <section id="dtc" class="hide">
        <div class="dwrap">
          <nav id="dnav"></nav>
          <div id="view"></div>
        </div>
      </section>

      <section id="kb">
        <div class="k">
          <aside class="ato" id="ato"></aside>
          <div>
            <div id="selinfo" class="selinfo"></div>
            <div class="bar">
              <select id="fsel" style="display: none">
                <option>— select a flight —</option></select
              ><button
                class="btn g"
                id="mdctog"
                title="Switch the card between the Datacard and the MDC format (Mission Data Card layout). Click a cell to edit it (Tab moves to the next)"
              >
                MDC format</button
              ><button
                class="btn g"
                id="rstf"
                style="display: none"
                title="Throw away the changes made by hand to this flight's datacard and fill it in again automatically"
              >
                ↺ Reset datacard</button
              ><span id="cinfo" class="hint"></span
              ><span
                class="wtip"
                style="margin-left: auto"
                title="AUTOMATIC RULES: what the program fills in, and from where. A value typed by hand stays for that flight; Reset datacard gives the rules back. Yellow cells are filled by a rule or chosen from a list.&#10;&#10;AIRBASES&#10;DEP / ARR: the airbase nearest to the take-off / first landing steerpoint. ALTN: the last landing steerpoint, when it is another airbase. TACAN, GND / APP, elevation, ILS: the airbase data; RWY and ILS: the runway into the wind at the take-off / landing time.&#10;ATIS: the METAR at the departure time (its day from Day 1), plus the TAF of the target or of the landing field (Weather page, TGT / LDG). MDC format: the colour code when the METAR does not fit.&#10;&#10;FLIGHT AND PACKAGE&#10;Names: the pilots of the campaign; the round button puts you on your seat (logbook name with rank, else your callsign); the menu of the cell lists the squadron roster.&#10;IDM, TCN (12Y, 22Y, 75Y, 85Y + flight number), Link 16, IFF: by position in the element, from the Link 16 and IFF files (IFF changes after take-off go to the notes). The seat decides what goes into the DTC and the MDC.&#10;Package: up to 5 flights: callsign, number and type, UHF / VHF of the radio plan, TCN, task.&#10;&#10;FLIGHT PLAN (24 steerpoints)&#10;Action; TOS = arrival (+ departure after a wait of 1 min or more); HDG, distance, Mach / TAS from the previous steerpoint; altitude; formation (Trail below 5,000 ft, Echelon at landing); MSA (terrain 5 NM each side + 500 ft) and ERAA (22 NM + 1,000 ft, 2,000 ft in mountains) from the HeightMap; Min.Fuel from the fuel plan. Landing: Overhead (speed and altitude of the Performance page) or Direct (field elevation, touchdown speed).&#10;&#10;LOADOUT AND PERFORMANCE&#10;A-A, A-G, ECM, tanks: the loadout of your seat (its group, when the aircraft carry different loadouts). Gross weight, drag index, fuel: empty + fuel + stores, pylons and racks included. TO Fuel: parking fuel minus 10 min of start and taxi.&#10;Bingo: the fuel plan, plus holding and alternate fuel when the landing field is IMC (marked IMC); without a fuel plan, the Bingo of the DTC. Joker = Bingo + the margin of the Performance page.&#10;TO Spec (AB / MIL, click to switch, pitch at lift-off), rotation, refusal (needs the runway length; none from a ship), Mil Power rpm, Mil Climb: the flight model, with elevation, wind and temperature of the departure.&#10;&#10;TARGET&#10;PRIMARY: the first steerpoint that is not take-off, route, tanker or landing (steerpoints with the same action form the group). Name: against ground units (DEAD, SEAD, CAS, BAI, SCAR, AI, FAC(A)) the hostile battalion within 1 km; else the closest object (3 km); else the action. ESCORT: Escort + the package flights that attack ground targets. STPT 99 of the DTC, when used, replaces name and position.&#10;SECONDARY: the first other package flight with an attack action (other flights go to the free text); STPT 98 of the DTC replaces it.&#10;TOT: CAS: time on station (first to last attack point); air missions: the patrol time; others: the TOT of the first action steerpoint.&#10;WEZ (exposure time), after the TOT: entry into the first enemy SAM ring to exit from the last, the minutes inside the rings and the largest SAM crossed (the rings of the map: spotted SAMs with their radar, maximum range at any altitude). Primary: this flight; secondary: its flight.&#10;ELEVATION: after Lat&amp;Long, the elevation of the target steerpoint (STPT 99 / 98). MDC format: Airspace / TGT is the primary target, the escorted flights in short form (ESC DL3 PR4: first and last letter of the callsign and its number).&#10;BY HAND: the point you pick (name, position, TOT; without a TOT of its own, the one of this flight). Saved in the mission, the same for the whole flight.&#10;&#10;WEAPON AND DELIVERY&#10;Profiles 1 / 2 and the bomb code: the bomb profiles and laser code of the DTC (written back while the weapon sync is on). Delivery: VRP or VIP, TBRG / RNG / ELV, OA1 / OA2 in ft from the NAV OFFSETS of the DTC; attack, headings, altitudes and speeds from the Weapons page (its Apply). Manual entry: everything from the page.&#10;&#10;EWS AND DTC&#10;EWS programs: the comments of the DTC. ALOW, MSL, Bingo: the ICP of the DTC, in step both ways while the sync is on.&#10;&#10;SUPPORT&#10;Tankers 1-2: allied tankers on station during the package (the package's own included): boom first (KC-135, KC-10), KC-130 first for aircraft with a probe (F/A-18, AV-8B, Tornado, Rafale...).&#10;AWACS / JSTARS: those of the package; when one is missing, the allied AEW/ABCCC (AWACS row) or ELINT, E-8C / RC-135 (JSTARS row), on station nearest to your route, marked * after the callsign. Callsign and aircraft, TACAN, UHF, position from the bullseye, operating time.&#10;FAC / JTAC: of the flight, when its mission has one (UHF 6 of the DTC radio plan).&#10;&#10;BVR TIMELINE&#10;The table of the BVR Timeline page (its classes and conditions, kept between sessions): written when the box is empty, or with Fill datacard.&#10;&#10;EPHEMERIDES&#10;Sun and Moon rise and set (with the Moon illumination) at the first action steerpoint, on the day of the mission."
                >ⓘ Automatic rules</span
              >
            </div>
            <p class="hint">
              Select a campaign (its weather, Link16, IFF and date files load automatically), pick a flight and the
              datacard fills itself in. You can edit any field by hand; the preview updates instantly.
            </p>
            <div id="form"></div>
          </div>
          <div class="cvwrap" id="cvwrap">
            <canvas id="cv" width="2048" height="2048"></canvas>
            <div id="cvhl"></div>
            <div id="cellhov"></div>
            <div id="seatov"></div>
            <div id="ed"></div>
            <div id="chm"></div>
            <div id="seatinfo" class="seatinfo"></div>
          </div>
        </div>
      </section>
      <section id="kn" class="hide"></section>
      <section id="mp" class="hide">
        <div id="mpside"></div>
        <div id="mpbody"></div>
      </section>
      <section id="wp" class="hide"></section>
      <section id="ms" class="hide"></section>
      <section id="pf" class="hide"></section>
      <section id="wx" class="hide"></section>
      <section id="sq" class="hide"></section>
      <section id="dc" class="hide"></section>
    </main>
    <script src="js/app/dialogs.js"></script>
    <script type="module" src="js/app/main.js"></script>
  </body>
</html>
