<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MDC card test</title>
<style>body{margin:0;background:#12161c;color:#dde;font:14px system-ui,sans-serif;padding:12px}h2{margin:10px 0 6px;font-size:15px}canvas{background:#fff;display:block;max-width:100%;border:1px solid #345}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.btn{background:#2a3a4c;color:#dde;border:1px solid #456;border-radius:6px;padding:6px 10px;cursor:pointer}</style></head><body>
<h1 style="font-size:17px;margin:0 0 8px">MDC card · test page (not linked to the app yet)</h1>
<div><button class="btn" id="smp">Sample flight</button> <button class="btn" id="png">Save PNG 2048×2048</button> <span id="info"></span></div>
<h2>Normal view (1600×1200)</h2><canvas id="a" width="1600" height="1200" style="width:min(100%,1600px)"></canvas>
<div class="row"><div><h2>Export 2048×2048 (stretched, as the Datacard)</h2><canvas id="b" width="2048" height="2048" style="width:520px"></canvas></div>
<div><h2>Export without the gap between the pages</h2><canvas id="c" width="2048" height="2048" style="width:520px"></canvas></div></div>
<script type="module">
import {mdcTexts,drawMdc,mdcGapless} from './js/core/mdccard.js';
const $=id=>document.getElementById(id), img=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src});
const [tpl,fields,F]=await Promise.all([img('mdc/blank.jpg'),fetch('mdc/fields.json').then(r=>r.json()),fetch('mdc/sample.json').then(r=>r.json())]);
window.__mdc={tpl,fields,F,draw};
function draw(F0){const F1=F0||F,t=mdcTexts(F1);drawMdc($('a').getContext('2d'),tpl,fields,t,1,1);drawMdc($('b').getContext('2d'),tpl,fields,t,2048/1600,2048/1200);const g=mdcGapless($('b'));$('c').getContext('2d').drawImage(g,0,0);$('info').textContent=Object.keys(t).length+' cells filled of '+fields.length;return t}
draw();$('smp').onclick=()=>draw();
$('png').onclick=()=>$('c').toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mdc.png';a.click()});
</script></body></html>
